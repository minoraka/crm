<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Студенты{% endblock %} — CRM колледжа</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #222; }
        header { background: #1f3a5f; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #fff; text-decoration: none; margin-right: 16px; }
        header form { display: inline; }
        main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1); }
        h1 { margin-top: 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e3e7eb; }
        th { background: #eef2f6; }
        .btn { display: inline-block; padding: 8px 14px; border: none; border-radius: 4px; background: #1f6feb; color: #fff; text-decoration: none; cursor: pointer; font-size: 14px; }
        .btn-gray { background: #6b7785; }
        .btn-red { background: #d1383d; }
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
        .toolbar input, .toolbar select { padding: 8px; border: 1px solid #c4ccd4; border-radius: 4px; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-weight: bold; margin-bottom: 4px; }
        .field input[type=text], .field input[type=password], .field input[type=email], .field input[type=number], .field input[type=date], .field select, .field textarea { width: 100%; padding: 8px; border: 1px solid #c4ccd4; border-radius: 4px; }
        .errorlist { color: #d1383d; margin: 4px 0 0; padding: 0; list-style: none; font-size: 13px; }
        .help { color: #6b7785; font-size: 12px; }
        .pagination { margin-top: 16px; }
        .pagination a { margin-right: 10px; }
        .detail { display: grid; grid-template-columns: 220px 1fr; gap: 8px 16px; }
        .detail dt { font-weight: bold; color: #4a5560; }
        .detail dd { margin: 0; }
        .photo { max-width: 180px; border-radius: 8px; margin-bottom: 16px; }
        .actions { margin-top: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <header>
        <div>
            <a href="{% url 'students:list' %}"><strong>CRM колледжа</strong></a>
            <a href="{% url 'students:list' %}">Студенты</a>
            {% if user.is_staff %}<a href="{% url 'admin:index' %}">Админка</a>{% endif %}
        </div>
        <div>
            {% if user.is_authenticated %}
                {{ user.username }}
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-gray" type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
            {% endif %}
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
