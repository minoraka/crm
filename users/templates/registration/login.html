{% extends 'users/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 0 auto;">
    <h1>Вход</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div class="field">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn" type="submit">Войти</button>
    </form>
</div>
{% endblock %}
